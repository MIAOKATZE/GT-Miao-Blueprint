// Isolated ordinary-runtime APPLY contract. Only the primary GTNH 2.9.2 pack executes it.
abstract class GTNHRuntimeMixinArguments implements CommandLineArgumentProvider {
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getNormalJar()
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getGregtechRuntime()
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getSrgRuntime()
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getForgeRuntime()
    @Input
    abstract Property<Boolean> getExpectMissingSelector()

    @Override Iterable<String> asArguments() {
        def arguments = [normalJar, gregtechRuntime, srgRuntime, forgeRuntime].collect { it.get().asFile.absolutePath }
        if (expectMissingSelector.get()) arguments.add('expect-missing-selector')
        return arguments
    }
}

def runtimeMixinGt = configurations.detachedConfiguration(
    // An explicit artifact bypasses GT's Gradle metadata, whose ordinary variant selects the dev JAR.
    dependencies.create('com.github.GTNewHorizons:GT5-Unofficial:5.09.54.277@jar'))
runtimeMixinGt.transitive = false
def runtimeMixinAsm = configurations.detachedConfiguration(dependencies.create('org.ow2.asm:asm-tree:9.9'))
def runtimeMixinBuildRoot = layout.buildDirectory.get().asFile.absolutePath + File.separator
def runtimeMixinProjectDirectory = layout.projectDirectory

tasks.register('verifyGTNH292RuntimeMixin', JavaExec) {
    group = 'verification'
    description = 'Really apply the shipped notification Mixin to ordinary GTNH 2.9.2 SRG runtime bytecode.'
    dependsOn('reobfJar', 'compileTestJava')
    // Never let main/mixin development classes shadow the ordinary release jar.
    def dependencyRuntime = tasks.named('runHologramTest').get().classpath.filter { artifact ->
        !artifact.absolutePath.startsWith(runtimeMixinBuildRoot)
    }
    mainClass.set('com.miaokatze.gtmb.compat.RuntimeMachineNotificationMixinProbe')
    def arguments = objects.newInstance(GTNHRuntimeMixinArguments)
    arguments.normalJar.set(providers.gradleProperty('gtmbRuntimeMixinReleaseJar')
        .map { runtimeMixinProjectDirectory.file(it) }.orElse(tasks.reobfJar.archiveFile))
    arguments.gregtechRuntime.set(providers.gradleProperty('gtmbRuntimeMixinGtJar')
        .map { runtimeMixinProjectDirectory.file(it) }.orElse(layout.file(providers.provider { runtimeMixinGt.singleFile })))
    arguments.srgRuntime.set(layout.buildDirectory.file('rfg/srg_merged_minecraft.jar'))
    arguments.forgeRuntime.set(layout.buildDirectory.file('rfg/recompiled_minecraft-1.7.10.jar'))
    arguments.expectMissingSelector.set(providers.gradleProperty('gtmbRuntimeMixinExpectMissingSelector')
        .map { it.toBoolean() }.orElse(false))
    // LaunchWrapper resources delegate to the application loader before its own URLs.
    classpath = runtimeMixinAsm + files(arguments.normalJar, arguments.gregtechRuntime,
        arguments.srgRuntime, arguments.forgeRuntime) + sourceSets.test.output + dependencyRuntime
    argumentProviders.add(arguments)
    def scratch = layout.buildDirectory.dir('runtime-mixin-probe')
    workingDir(scratch)
    doFirst { scratch.get().asFile.mkdirs() }
    maxHeapSize = '1g'
}

if (providers.gradleProperty('gtmbTargetGtnh').getOrElse('2.9.2') == '2.9.2') {
    tasks.named('check') { dependsOn('verifyGTNH292RuntimeMixin') }
}
