dependencies {
    // GTNH 2.9.0；仅保留投影仪及 GregTech 签名的实际依赖。
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.264") { transitive = false }
    api("com.github.GTNewHorizons:StructureLib:1.4.47:dev") { transitive = false }
    api("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1095-GTNH:dev") { transitive = false }
    api("com.github.GTNewHorizons:GTNHLib:0.11.54:dev") { transitive = false }
    api("com.github.GTNewHorizons:ModularUI:1.3.4:dev") { transitive = false }
    api("com.github.GTNewHorizons:ModularUI2:2.3.94-1.7.10:dev") { transitive = false }
    // MUI2's optional client input interfaces must also be present for javac and non-FML regressions.
    compileOnly("com.github.GTNewHorizons:lwjgl3ify:3.0.42:api") { transitive = false }
    testImplementation("com.github.GTNewHorizons:lwjgl3ify:3.0.42:api") { transitive = false }
    compileOnly rfg.deobf("curse.maven:neverenoughanimation-1062347:7664003-sources-7663978")
    testImplementation rfg.deobf("curse.maven:neverenoughanimation-1062347:7664003-sources-7663978")
    // Native MUI2 viewport/hover signatures; GTNHLib supplies these libraries in the target pack.
    compileOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }
    compileOnly("org.joml:joml:1.10.8") { transitive = false }
    compileOnly("com.github.GTNewHorizons:NotEnoughItems:2.8.171-GTNH:dev") { transitive = false }
    compileOnly("net.industrial-craft:industrialcraft-2:2.2.828-experimental:api") { transitive = false }
    // Optional integrations, pinned to the GTNH 2.9.0 instance; never production requirements.
    compileOnly("com.github.GTNewHorizons:CarpentersBlocks:3.7.3-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:ForgeMultipart:1.7.18:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:LittleTiles:1.6.63:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:ArchitectureCraft:1.12.19:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:EnderIO:2.10.51:dev") { transitive = false }

    // Opt in only for a smoke run; this configuration is excluded from published dependencies.
    if (providers.gradleProperty("hologramExtendedCompatibility").isPresent()) {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:CarpentersBlocks:3.7.3-GTNH:dev") { transitive = false }
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:ForgeMultipart:1.7.18:dev") { transitive = false }
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:LittleTiles:1.6.63:dev") { transitive = false }
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:ArchitectureCraft:1.12.19:dev") { transitive = false }
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:EnderIO:2.10.51:dev") { transitive = false }
        // FMP requires CCC >= 1.4.3; 1.4.22 matches GTNH 2.9.0. CreativeCore is embedded in LittleTiles.
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:CodeChickenCore:1.4.22:dev") { transitive = false }
        // Exact dependencies from EnderIO 2.10.51/dependencies.gradle; GTNHLib and ModularUI2 are above.
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:EnderCore:0.5.15:dev") { transitive = false }
        runtimeOnlyNonPublishable("curse.maven:cofh-lib-220333:2388748") { transitive = false }
        // ArchitectureCraft's TileShape reads Postea replacements; 1.2.7 matches GTNH 2.9.0.
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Postea:1.2.7:dev") { transitive = false }
    }
    // UniMixins/MixinExtras 由 usesMixins=true 的 GTNH convention 提供。
    if (providers.gradleProperty("hologramEssentiaSmoke").isPresent()) {
        runtimeOnlyNonPublishable("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev") { transitive = false }
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:ThaumicEnergistics:1.7.68-GTNH:dev") { transitive = false }
    }
    if (providers.gradleProperty("hologramCoordinateSmoke").isPresent()) {
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:Nuclear-Control:2.7.17:dev") { transitive = false }
    }
    if (providers.gradleProperty("hologramSulfurLineSmoke").isPresent()) {
        // Exact AE2FC version from the GTNH 2.9.0 instance; finite native fluid cells are required by this fixture.
        runtimeOnlyNonPublishable("com.github.GTNewHorizons:AE2FluidCraft-Rework:1.5.116-gtnh:dev") { transitive = false }
        runtimeOnlyNonPublishable(files("build/hologram-support/server/mods/gtswn-v1.8.67-dev.jar"))
    }
}

// Shared library API; immutable candidate versions may be supplied for isolated integration builds.
dependencies {
    def coreVersion = project.findProperty("miaokatzeCoreVersion") ?: "0.2.0"
    api("com.miaokatze.miaokatzecore:miaokatzecore:${coreVersion}:dev") { transitive = false }
}
