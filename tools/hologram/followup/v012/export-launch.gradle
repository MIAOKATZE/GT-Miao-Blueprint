import groovy.json.JsonOutput

// Export an isolated follow-up launch; exporting never starts Minecraft.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def role = project.hasProperty('hologramInteractionServer') || project.hasProperty('hologramSmoke') ? 'server' : 'client'
    def launch = project.tasks.named(role == 'server' ? 'runServer' : 'runClient').get()
    project.tasks.register('exportFollowupLaunch') {
        group = 'verification'
        notCompatibleWithConfigurationCache('This read-only export snapshots the configured Minecraft launch and current source bytes.')
        dependsOn(launch.taskDependencies.getDependencies(launch))
        doLast {
            def profile = project.findProperty('followupProfile') ?: 'area'
            if (!(profile in ['area', 'decor', 'essentia', 'workbench', 'sulfur'])) throw new GradleException('Unknown follow-up profile')
            def arguments = []
            arguments.addAll(launch.allJvmArgs)
            arguments.addAll(launch.calculateJvmArgs())
            // The selected new fixture owns this process; old full matrices do not register.
            def oldDrivers = ['smoke', 'smoketest', 'clientSmoke', 'interactionServer', 'realInteractionSmoke',
                              'productionPreviewSmoke', 'networkInteractionSmoke', 'energyNetworkSmoke',
                              'v010WorldSmoke', 'v010GuiSmoke', 'librarySocketSmoke', 'aeRealInteractionSmoke',
                              'compatibilitySmoke', 'extendedCompatibilitySmoke', 'aeExternalCellSmoke',
                              'aeClientSmoke', 'coexistSmoke', 'referenceServer', 'referenceClient',
                              'networkBindingSmoke', 'packagedPreviewProbe']
            arguments = arguments.findAll { value -> !oldDrivers.any { flag -> value.startsWith('-Dgtmb.hologram.' + flag + '=') } }
            oldDrivers.each { flag -> arguments.add('-Dgtmb.hologram.' + flag + '=false') }
            arguments = arguments.findAll { value -> !value.startsWith('-DenergyNetworkSmoke=') }
            arguments.add('-DenergyNetworkSmoke=false')
            def flag = profile == 'sulfur' ? 'sulfurLine' : profile == 'area' ? 'followupArea' : profile == 'workbench' ? 'followupWorkbench' : 'followupWorld'
            arguments.add('-Dgtmb.hologram.' + flag + (role == 'server' ? 'Server' : 'Client') + '=true')
            arguments.add('-Dgtmb.hologram.followupProfile=' + profile)
            if (profile in ['workbench', 'sulfur']) arguments.add('-Dgtmb.hologram.previewCaptureWitness=true')
            arguments.addAll(['-cp', launch.classpath.asPath, launch.mainClass.get()])
            arguments.addAll(launch.args ?: [])
            arguments.addAll(launch.calculateArgs())
            def checksum = { File file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
            def sourceHashes = [:]
            ['src/main', 'src/mixin'].each { directory ->
                project.fileTree(directory).files.findAll { it.isFile() }.sort { it.absolutePath }.each { file ->
                    sourceHashes[project.projectDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')] = checksum(file)
                }
            }
            def engineHashes = [:]
            def libraries = new File(project.buildDir, 'libs').canonicalFile
            launch.classpath.files.findAll { it.isFile() && it.parentFile.canonicalFile == libraries }.each { file ->
                engineHashes[file.canonicalPath] = checksum(file)
            }
            if (!engineHashes) throw new GradleException('Current engine jar must be present in exported runtime classpath')
            def reviewedRuntimeHashes = [:]
            if (profile == 'sulfur') {
                launch.classpath.files.findAll { it.isFile() && (it.name == 'gtswn-v1.8.67-dev.jar' ||
                    it.name == 'AE2FluidCraft-Rework-1.5.113-gtnh-dev.jar') }.each { file ->
                    reviewedRuntimeHashes[file.canonicalPath] = checksum(file)
                }
                if (reviewedRuntimeHashes.size() != 2) throw new GradleException('Sulfur needs exactly the reviewed GTSWN and AE2FC runtime jars')
                def quantumRuntime = reviewedRuntimeHashes.findAll { path, hash -> path.endsWith('gtswn-v1.8.67-dev.jar') }
                if (quantumRuntime.values().toList() != ['6f377dc7be30d7ce3df712762a4851a54e1c0e981a09148e27a166ebc4c223ac'])
                    throw new GradleException('GTSWN 1.8.67 runtime differs from the reviewed clean native JAR')
            }
            def destination = new File(project.projectDir, 'plan/tmp/v0.1.2/' + profile + '-' + role + '-launch.json')
            destination.parentFile.mkdirs()
            destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                java: launch.javaLauncher.get().executablePath.asFile.absolutePath,
                workingDirectory: launch.workingDir.absolutePath, arguments: arguments,
                profile: profile, role: role, release_version: '0.1.2',
                source_hashes: sourceHashes, engine_jar_hashes: engineHashes, reviewed_runtime_hashes: reviewedRuntimeHashes
            ])), 'UTF-8')
            println('Exported current ' + profile + ' ' + role + '; Minecraft was not started.')
        }
    }
}
